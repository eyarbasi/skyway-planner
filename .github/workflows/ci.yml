name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:single
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Name the single-file build
        run: cp dist-single/index.html skyway-planner.html
      - uses: actions/upload-artifact@v4
        with:
          name: skyway-planner.html
          path: skyway-planner.html
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
