name: Release

# Push a tag like v0.1.0 to attach skyway-planner.html (one file, works offline except imagery) to a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:single
      - run: cp dist-single/index.html skyway-planner.html
      - uses: softprops/action-gh-release@v2
        with:
          files: skyway-planner.html
          generate_release_notes: true
